# CodeRabbit config for tirforge/Aruvi (public repo = free OSS plan).
# NOTE: the CodeRabbit GitHub App must still be installed on the repo
# (coderabbit.ai -> sign up with GitHub -> add tirforge/Aruvi).
# This file pre-configures its behavior once installed.
language: en-US
tone_instructions: >
  Be concise and direct. This is a solo-dev Telegram media streaming app
  (FastAPI backend, React+Vite frontend). Prioritize real bugs, auth/token
  issues, and performance over style nits.
reviews:
  profile: assertive
  auto_review:
    enabled: true
  finishing_touches:
    enabled: false
  # Skip 11MB vendored player bundles (third-party code + chokes reviewers)
  path_filters:
    - "!frontend/public/vendor/**"
    - "!backend/app/static/vendor/**"
  # Per-repo review rules MUST live here: a top-level `code_guidelines`
  # key is not in the schema and is silently ignored (caught by
  # CodeRabbit's own review). Instructions cap: 20000 chars per entry.
  path_instructions:
    - path: backend/**
      instructions: >
        Flag: raw SQL without bind parameters, N+1 query patterns,
        auth/token handling flaws, secrets in code, missing input
        validation on new endpoints, unbounded file/memory operations
        on streams.
    - path: frontend/**
      instructions: >
        Flag: tokens in localStorage without rotation handling, XSS via
        dangerouslySetInnerHTML or unescaped URLs, focus loss after
        modal/menu close, unhandled promise rejections in event handlers,
        useEffect missing cleanup or stale-closure races.
tools:
  ruff:
    config_file: backend/pyproject.toml
chat:
  auto_reply: true
