# Gitleaks allowlist for Aruvi.
# The curl-auth-user rule flags `curl -u "$VAR:"` even when the credential
# is an env-var reference, not a literal.
#
# LOAD-BEARING: `[extend] useDefault = true` below. Without it this file
# REPLACES the default ruleset with zero rules and every scan passes
# vacuously (that happened once — green runs with no rules loaded).
# Never remove it; ci_selfcheck enforces its presence.
[extend]
useDefault = true

[allowlist]
description = "SONAR_TOKEN env reference in SonarCloud API calls (variable, not a value)"
# Matched against the detected secret, which is the VARIABLE REFERENCE, never
# a value. Both shapes the harvest can produce must be covered:
#   CURL_AUTH=(-u "$SONAR_TOKEN:")        -> $SONAR_TOKEN:
#   curl -u "${SONAR_TOKEN:-}:"           -> ${SONAR_TOKEN:-}
# So match the reference itself (`${SONAR_TOKEN` / `$SONAR_TOKEN`). A real
# pasted credential does not contain that literal text, so it is still caught.
# ci_selfcheck verifies this regex still matches every -u reference in
# harvest-findings.sh, so the two cannot drift apart silently.
regexes = ['''\$\{?SONAR_TOKEN''']
