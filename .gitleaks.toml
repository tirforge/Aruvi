# Gitleaks allowlist for Aruvi.
# The curl-auth-user rule flags `curl -u "$VAR:"` even when the credential
# is an env-var reference, not a literal.
#
# LOAD-BEARING: `[extend] useDefault = true` below. Without it this file
# REPLACES the default ruleset with zero rules and every scan passes
# vacuously (that happened once — green runs with no rules loaded).
# Never remove it; ci_selfcheck enforces its presence.
[extend]
useDefault = true

[allowlist]
description = "SONAR_TOKEN env reference in SonarCloud API calls (variable, not a value)"
# Matched against the detected secret, which for
#   curl -sf -u "${SONAR_TOKEN:-}:" -o ...
# is the literal text `${SONAR_TOKEN:-}` — a variable reference, never a
# value. Kept tight on purpose: any real pasted credential is still flagged.
# ci_selfcheck verifies this regex still matches the live curl line in
# harvest-findings.sh, so the two can't drift apart silently.
regexes = ['''\$\{SONAR_TOKEN:-\}''']
