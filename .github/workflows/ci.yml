name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            android:
              - 'android/**'
              - '.github/workflows/ci.yml'
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q app
        working-directory: backend
      - name: Run tests (non-blocking until suite exists)
        run: pytest -q || echo "no tests yet"
        working-directory: backend
        env:
          JWT_SECRET: ci-dummy-secret
          DATABASE_URL: sqlite:///./test.db
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: ESLint
        run: npx eslint . --max-warnings 0
        working-directory: frontend
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
        working-directory: frontend
      - name: Unit tests
        run: npm test -- --run
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
  build:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x android/gradlew
      - name: Build debug APKs (mobile + tv)
        run: ./gradlew assembleMobileDebug assembleTvDebug
        working-directory: android
      - name: Android Lint
        run: ./gradlew lint
        working-directory: android
  gate:
    needs: [changes, backend, frontend, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on required areas
        run: |
          fail=0
          [ "${{ needs.backend.result }}" = "failure" ] && fail=1
          [ "${{ needs.backend.result }}" = "cancelled" ] && fail=1
          [ "${{ needs.frontend.result }}" = "failure" ] && fail=1
          [ "${{ needs.frontend.result }}" = "cancelled" ] && fail=1
          [ "${{ needs.build.result }}" = "failure" ] && fail=1
          [ "${{ needs.build.result }}" = "cancelled" ] && fail=1
          exit $fail
