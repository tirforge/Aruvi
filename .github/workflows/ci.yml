name: CI

on:
  push:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "backend/**"
              - "docker-compose.yml"
              - "Dockerfile"
            frontend:
              - "frontend/**"
            android:
              - "android/**"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile check (matches AGENTS.md rule)
        run: python -m compileall -q app
      - name: Unit tests (non-blocking)
        run: python -m pytest tests/test_fixes.py tests/test_cast_remux.py -q
        continue-on-error: true
        env:
          JWT_SECRET: ci-dummy-secret
          DATABASE_URL: sqlite+aiosqlite:///./ci_test.db

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint . --ext ts,tsx --max-warnings 0
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build

  build:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Assemble mobile + TV debug
        run: ./gradlew :app:assembleMobileDebug :app:assembleTvDebug --no-daemon
      - name: Lint mobile + TV debug
        continue-on-error: true
        # Lint is informational for now (43 pre-existing errors, e.g. MissingLeanbackLauncher);
        # failures here don't block the PR. Follow-up: fix errors or add a baseline, then re-enforce.
        run: ./gradlew :app:lintMobileDebug :app:lintTvDebug --no-daemon

  gate:
    needs: [changes, backend, frontend, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate area results
        run: |
          [ "${{ needs.changes.result }}" = "success" ] || { echo "changes job: ${{ needs.changes.result }}"; exit 1; }
          for r in "${{ needs.backend.result }}" "${{ needs.frontend.result }}" "${{ needs.build.result }}"; do
            case "$r" in success|skipped) ;; *) echo "area result: $r"; exit 1;; esac
          done
          echo "CI gate passed"
