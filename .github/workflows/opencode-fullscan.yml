name: opencode-fullscan

# Full-repo audit per area: each job scans its whole tree with opencode
# (muse-spark-1.3 xhigh) and opens a SEPARATE fix PR for backend, frontend,
# and android. Fix PRs then get the normal treatment: CI + CodeQL +
# opencode-review + CodeRabbit + Sonar.
# Runs weekly + on demand (Actions tab -> Run workflow).
# Heavy on xhigh: lower `variant` or narrow scope if runs get slow/pricey.
on:
  workflow_dispatch:
    inputs:
      area:
        description: "Area to scan (all = backend+frontend+android)"
        type: choice
        default: all
        options: [all, backend, frontend, android]
  schedule:
    # Sundays 3am UTC
    - cron: "0 3 * * 0"

jobs:
  scan:
    # NOTE: no job-level `if` with matrix here on purpose — `matrix` is not
    # available in jobs.<job>.if (docs: only github/needs/vars/inputs), so a
    # matrix comparison there silently skips everything. Area filtering lives
    # on the steps below, where `matrix` IS available.
    strategy:
      fail-fast: false
      matrix:
        area: [backend, frontend, android]
    runs-on: ubuntu-latest
    # xhigh full-repo audit of frontend exceeds 2h (cancelled @120m on
    # 2026-09-27); backend/android finish in ~15min. Keep headroom.
    timeout-minutes: 300
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Prompt-only identity (user.name passed on the commit command line)
      # is fragile: an agent that runs plain `git commit` hits exit 128
      # failure review-combo's fixer hit on 2026-09-26. Belt and suspenders:
      # real config here, prompt keeps plain `git commit` below.
      - name: Configure git identity (fixer commits)
        run: |
          git config user.name "Aruvi bot"
          git config user.email "aruvi@users.noreply.github.com"

      # Targeted re-runs: dispatch with area=backend to scan one area only.
      # Scheduled runs and area=all scan everything (inputs.area is empty on
      # schedule, so the first clause covers it).
      - uses: anomalyco/opencode/github@545f51d26cc39a907d2867492d498d9607ea5fa4 # v1.18.32
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.area == 'all' || inputs.area == matrix.area }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
          variant: xhigh
          use_github_token: true
          prompt: |
            Full-repo audit and fix for the `${{ matrix.area }}` codebase.

            SCOPE (strict): only touch files under `${{ matrix.area }}/`.
            Never touch other top-level dirs, `.github/`, or vendored/build
            output (backend: `app/static/vendor/`, `app/static/assets/`;
            frontend: `public/vendor/`; android: `build/`, `.gradle/`).

            TASK:
            - Scan the ENTIRE `${{ matrix.area }}` tree for bugs, security
              issues (auth, tokens, injection, secrets), dead code, race
              conditions, and error-handling gaps.
            - Apply safe, minimal fixes directly in the code. No refactors,
              no dependency changes, no UI redesigns.
            - Verify what you can (typecheck/lint/build if the toolchain
              exists in the runner).

            DELIVERY:
            - If you fixed anything: create branch
              `opencode/fullscan-${{ matrix.area }}-${{ github.run_number }}`,
              commit (identity is pre-configured above), push, and open
              a PR titled `opencode fullscan: ${{ matrix.area }} fixes`
              listing every bug found + fixed (file:line for each).
            - Right after opening the PR, comment `@coderabbitai review`
              on it. This repo is under 10 stars so CodeRabbit only
              reviews on manual trigger — without this comment the
              CodeRabbit layer of the combo never runs. (CI, CodeQL,
              opencode-review, and Sonar all fire automatically on the
              new PR; only CodeRabbit needs the nudge.)
            - Before anything else, write
              `fullscan-${{ matrix.area }}-report.md` at repo root:
              dirs scanned, file count, then either an explicit CLEAN
              verdict (say what was checked) or the full finding list
              (file:line for each). A run that publishes no verdict file
              counts as FAILED, never as clean.
            - If nothing worth fixing: do NOT open a PR. The report file
              with the CLEAN verdict IS the delivery (published to the
              step summary + artifacts by the workflow below).
            - If a fix PR for this area is already open, add to it instead
              of opening a duplicate.
            - After opening (or adding to) the fix PR, write its full URL
              into the report as `Fix PR: <url>`. A non-CLEAN report with
              no open fix PR FAILS the run — a deterministic workflow step
              verifies this after you finish, so complete the delivery
              before you stop. Fixes that live only in your workspace are
              deleted with the runner and count as NOT DELIVERED.

      - name: Publish verdict to step summary
        # Same area gate as the scan step: a skipped area must not false-fail
        # here for a missing report file.
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.area == 'all' || inputs.area == matrix.area) }}
        run: |
          f="fullscan-${{ matrix.area }}-report.md"
          if [ -f "$f" ]; then
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## fullscan ${{ matrix.area }}: NO REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo "The agent produced no verdict file (crashed or failed before finishing). Treat this run as FAILED, not clean." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload verdict artifact
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.area == 'all' || inputs.area == matrix.area) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # gitlab-opencode port: per-run prefix (job_prefix idea) so weekly
          # backend/frontend/android reports never overwrite each other.
          name: fullscan-${{ matrix.area }}-report-${{ github.run_number }}
          path: fullscan-${{ matrix.area }}-report.md
          if-no-files-found: error

      - name: Verify delivery (deterministic gate)
        # The agent is trusted to audit, not to self-report delivery. A
        # non-CLEAN report with no open fix PR means the fixes died with
        # the runner workspace (seen 2026-10-01 frontend: 15 findings
        # fixed + verified, zero PRs). Fail loud so it gets re-run.
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.area == 'all' || inputs.area == matrix.area) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f="fullscan-${{ matrix.area }}-report.md"
          [ -f "$f" ] || { echo "::error::no verdict file"; exit 1; }
          branch="opencode/fullscan-${{ matrix.area }}-${{ github.run_number }}"
          if [ "$(bash .github/scripts/gh-retry.sh pr list --head "$branch" --state open --json number --jq 'length')" -ge 1 ]; then
            echo "DELIVERED: open fix PR on $branch."
            exit 0
          fi
          url="$(grep -oiE 'https://github\.com/[^[:space:]]+/pull/[0-9]+' "$f" | head -1)"
          if [ -n "$url" ] && [ "$(bash .github/scripts/gh-retry.sh pr view "$url" --json state --jq .state)" = "OPEN" ]; then
            echo "DELIVERED: report names open $url."
            exit 0
          fi
          if grep -qiE '^CLEAN([ :]|$)' "$f"; then
            echo "CLEAN verdict — no PR required."
            exit 0
          fi
          echo "::error::non-CLEAN report but no open fix PR (expected head $branch or an open PR URL in the report). Re-run the scan."
          exit 1
