name: Gitleaks

# Free secret-leak scanner: fails the run if a commit introduces
# tokens, keys, or passwords. Scans new commits only (fast).
# If it flags a historic secret, add a fingerprint to
# .gitleaksignore after rotating the secret — never to hide it.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
