name: Ruff

# Free Python lint review: pycodestyle errors + pyflakes on the backend.
# Rules live in backend/pyproject.toml (tight set on purpose — see comments).
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install "ruff==0.16.9"

      - name: Lint backend
        run: ruff check backend/app
