name: Build Android APKs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish APKs to (e.g. v2.0.0). Leave empty for artifact-only build"
        required: false
      server_url:
        description: "Hardcoded default server URL baked into the app (optional, e.g. https://movie.aaruvi.space)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure release keystore
        if: ${{ env.KEYS != '' }}
        env:
          KEYS: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          echo "$KEYS" | base64 -d > android/my-release-key.jks
          echo "Keystore restored from secret."

      - name: Bake default server URL (workflow_dispatch with server_url)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.server_url != ''
        working-directory: android
        run: |
          echo "TELEGRAM_TV_SERVER_URL=${{ github.event.inputs.server_url }}" > local.properties
          echo "Hardcoded DEFAULT_SERVER_URL -> ${{ github.event.inputs.server_url }}"

      - name: Build APKs (release, R8-minified, debug-signed when no release key)
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleMobileRelease :app:assembleTvRelease
          mkdir -p dist
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk dist/Aruvi-mobile.apk
          cp app/build/outputs/apk/tv/release/app-tv-release.apk dist/Aruvi-tv.apk
          ls -la dist

      # Attach APKs to the release that triggered this run (release event)
      - name: Upload APKs to release (release event)
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: android/dist/*.apk
          overwrite: true

      # Or to a manually-specified release (workflow_dispatch with release_tag).
      # Deletes existing matching assets first (GitHub has no overwrite-on-POST),
      # then uploads the fresh APKs.
      - name: Upload APKs to release (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.release_tag }}"
          AUTH="Authorization: Bearer $GH_TOKEN"
          REL=$(curl -s -H "$AUTH" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          REL_ID=$(echo "$REL" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          UPLOAD_URL=$(echo "$REL" | python3 -c "import sys,json; print(json.load(sys.stdin)['upload_url'].split('{')[0])")
          echo "release_id=$REL_ID"
          echo "upload_url=$UPLOAD_URL"

          # Delete any existing assets whose names collide with the fresh APKs
          echo "$REL" > /tmp/rel.json
          python3 -c '
          import json, urllib.request, os
          rel = json.load(open("/tmp/rel.json"))
          token = os.environ["GH_TOKEN"]
          for a in rel.get("assets", []):
              if a["name"] in ("Aruvi-mobile.apk", "Aruvi-tv.apk"):
                  try:
                      req = urllib.request.Request(
                          "https://api.github.com/repos/tirforge/Aruvi/releases/assets/%s" % a["id"],
                          method="DELETE",
                          headers={"Authorization": "Bearer %s" % token})
                      urllib.request.urlopen(req)
                      print("deleted old asset %s" % a["name"])
                  except Exception as e:
                      print("delete %s failed (continuing): %s" % (a["name"], e))
          '
          rm -f /tmp/rel.json

          for apk in android/dist/*.apk; do
            code=$(curl -s -X POST -H "$AUTH" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@$apk" \
              -o /dev/null -w "%{http_code}" \
              "$UPLOAD_URL?name=$(basename "$apk")")
            echo "uploaded $(basename "$apk") -> $code"
          done

      # Always keep the APKs as workflow artifacts
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aruvi-apks
          path: android/dist/*.apk
          if-no-files-found: error