name: Build Android APKs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish APKs to (e.g. v2.0.0). Leave empty for artifact-only build"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure release keystore
        if: ${{ env.KEYS != '' }}
        env:
          KEYS: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          echo "$KEYS" | base64 -d > android/my-release-key.jks
          echo "Keystore restored from secret."

      - name: Build APKs (release, R8-minified, debug-signed when no release key)
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleMobileRelease :app:assembleTvRelease
          mkdir -p dist
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk dist/Aruvi-mobile.apk
          cp app/build/outputs/apk/tv/release/app-tv-release.apk dist/Aruvi-tv.apk
          ls -la dist

      # Attach APKs to the release that triggered this run (release event)
      - name: Upload APKs to release (release event)
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: android/dist/*.apk
          overwrite: true

      # Or to a manually-specified release (workflow_dispatch with release_tag)
      - name: Upload APKs to release (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.release_tag }}"
          REL=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          UPLOAD_URL=$(echo "$REL" | /home/runner/ruby/bin/ruby -rjson -e 'puts JSON.parse(STDIN.read)["upload_url"]' 2>/dev/null \
            || echo "$REL" | python3 -c "import sys,json; print(json.load(sys.stdin)['upload_url'])")
          echo "upload_url=$UPLOAD_URL"
          for apk in android/dist/*.apk; do
            curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@$apk" \
              -w "%{http_code}\n" -o /dev/null \
              "${UPLOAD_URL%\{*}?name=$(basename "$apk")"
          done

      # Always keep the APKs as workflow artifacts
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aruvi-apks
          path: android/dist/*.apk
          if-no-files-found: error