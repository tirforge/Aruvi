name: Build Android APKs

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure signing
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > android/my-release-key.jks
          fi

      - name: Build APKs
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleMobileRelease :app:assembleTvRelease
          mkdir -p dist
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk dist/Aruvi-mobile.apk 2>/dev/null || true
          cp app/build/outputs/apk/tv/release/app-tv-release.apk dist/Aruvi-tv.apk 2>/dev/null || true
          ls -la dist

      # Attach APKs to the release that triggered this run
      - name: Upload APKs to release
        if: github.event_name == 'release' && hashFiles('android/dist/*') != ''
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: android/dist/*
          overwrite: true

      # Always keep the APKs as workflow artifacts
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aruvi-apks
          path: android/dist/*.apk
          if-no-files-found: error