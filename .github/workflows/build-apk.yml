name: Build Android APKs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish APKs to (e.g. v2.0.0). Leave empty for artifact-only build"
        required: false
      server_url:
        description: "Hardcoded default server URL baked into the app (optional, e.g. https://movie.aaruvi.space)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Set up Gradle (dependency + build cache)
        # Was pinned to 0b6dd653…, which exists in no repo (commits API and
        # git-object API both 404): the action could never load. Re-pinned to
        # the current v4 release commit.
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-cleanup: on-success

      - name: Configure release keystore
        # NOTE: a step cannot read its own `env:` from `if:`, so the old
        # `if: env.KEYS != ''` was always false and the key was never restored
        # (every "release" APK silently shipped DEBUG-signed). Do the check
        # inside the script instead.
        env:
          KEYS: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYS" ]; then
            printf '%s' "$KEYS" | base64 -d > android/my-release-key.jks
            echo "Keystore restored from secret ($(stat -c%s android/my-release-key.jks) bytes)."
          else
            echo "::warning::RELEASE_KEYSTORE_B64 is not set - the APKs will be DEBUG-signed."
          fi

      - name: Bake default server URL (input > repo variable > secret)
        env:
          INPUT_URL: ${{ github.event.inputs.server_url }}
          VAR_URL: ${{ vars.ARUVI_SERVER_URL }}
          SECRET_URL: ${{ secrets.ARUVI_SERVER_URL }}
        working-directory: android
        run: |
          URL="${INPUT_URL:-${VAR_URL:-$SECRET_URL}}"
          if [ -n "$URL" ]; then
            echo "TELEGRAM_TV_SERVER_URL=$URL" > local.properties
            echo "Hardcoded DEFAULT_SERVER_URL -> $URL"
          else
            echo "No server URL set (input / vars.ARUVI_SERVER_URL / secrets.ARUVI_SERVER_URL); using the Gradle default."
          fi

      - name: Build APKs (release, R8-minified, release-signed when the key is set)
        working-directory: android
        env:
          # The keystore step above writes android/my-release-key.jks, which is
          # also the Gradle default; the alias/passwords come from repo secrets.
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE || '../my-release-key.jks' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --build-cache --parallel :app:assembleMobileRelease :app:assembleTvRelease
          mkdir -p dist
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk dist/Aruvi-mobile.apk
          cp app/build/outputs/apk/tv/release/app-tv-release.apk dist/Aruvi-tv.apk
          ls -la dist

      - name: Verify APK signing (v2 + v3)
        working-directory: android
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "using $BT"
          fail=0
          for apk in dist/*.apk; do
            echo "== $apk"
            out=$("$BT/apksigner" verify --verbose --min-sdk-version 24 --print-certs "$apk")
            echo "$out" | grep -E "Verified using v[23] scheme|Signer #1 certificate (DN|SHA-256)"
            if echo "$out" | grep -q "CN=Android Debug"; then
              echo "::error::$apk is DEBUG-signed - refusing to publish it."
              fail=1
            fi
          done
          exit $fail

      # Attach APKs to the release that triggered this run (release event)
      - name: Upload APKs to release (release event)
        if: github.event_name == 'release'
        # Was pinned to 31b40094…, which exists in no repo (both APIs 404).
        # Re-pinned to the current v1 release commit.
        uses: shogo82148/actions-upload-release-asset@73f83b114970a3485e1423ecc1fb93d887c9b096 # v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: android/dist/*.apk
          overwrite: true

      # Or to a manually-specified release (workflow_dispatch with release_tag).
      # Deletes existing matching assets first (GitHub has no overwrite-on-POST),
      # then uploads the fresh APKs.
      - name: Upload APKs to release (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.release_tag }}"
          AUTH="Authorization: Bearer $GH_TOKEN"
          REL=$(curl -s -H "$AUTH" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          REL_ID=$(echo "$REL" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          UPLOAD_URL=$(echo "$REL" | python3 -c "import sys,json; print(json.load(sys.stdin)['upload_url'].split('{')[0])")
          echo "release_id=$REL_ID"
          echo "upload_url=$UPLOAD_URL"

          # Delete any existing assets whose names collide with the fresh APKs
          echo "$REL" > /tmp/rel.json
          python3 -c '
          import json, urllib.request, os
          rel = json.load(open("/tmp/rel.json"))
          token = os.environ["GH_TOKEN"]
          for a in rel.get("assets", []):
              if a["name"] in ("Aruvi-mobile.apk", "Aruvi-tv.apk"):
                  try:
                      req = urllib.request.Request(
                          "https://api.github.com/repos/tirforge/Aruvi/releases/assets/%s" % a["id"],
                          method="DELETE",
                          headers={"Authorization": "Bearer %s" % token})
                      urllib.request.urlopen(req)
                      print("deleted old asset %s" % a["name"])
                  except Exception as e:
                      print("delete %s failed (continuing): %s" % (a["name"], e))
          '
          rm -f /tmp/rel.json

          for apk in android/dist/*.apk; do
            code=$(curl -s -X POST -H "$AUTH" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@$apk" \
              -o /dev/null -w "%{http_code}" \
              "$UPLOAD_URL?name=$(basename "$apk")")
            echo "uploaded $(basename "$apk") -> $code"
          done

      # Always keep the APKs as workflow artifacts
      - name: Upload APK artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aruvi-apks
          path: android/dist/*.apk
          if-no-files-found: error