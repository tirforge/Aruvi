name: Build Android APKs

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APKs (debug-signed)
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:assembleMobileDebug :app:assembleTvDebug
          mkdir -p dist
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk dist/Aruvi-mobile.apk
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk dist/Aruvi-tv.apk
          ls -la dist

      # Attach APKs to the release that triggered this run
      - name: Upload APKs to release
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: android/dist/*.apk
          overwrite: true

      # Always keep the APKs as workflow artifacts
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aruvi-apks
          path: android/dist/*.apk
          if-no-files-found: error