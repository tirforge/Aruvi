name: SonarCloud

# Free static analysis for public repos: bugs, smells, duplication,
# quality gate on every PR. One-time setup (2 min):
#  1. sonarcloud.io -> + -> Analyze new project -> import tirforge/Aruvi
#     (project key must be tirforge_Aruvi, org tirforge)
#  2. My Account -> Security -> Generate Token -> repo Settings ->
#     Secrets -> Actions -> New secret named SONAR_TOKEN
# Until then this job is skipped entirely (shows SKIP, blocks nothing).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # Job-level `if:` cannot read `secrets` (invalid workflow = 0-job
      # instant fail), so gate at step level instead. No token = clean
      # skip; token present = real scan.
      - name: Check for SONAR_TOKEN
        id: gate
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No SONAR_TOKEN secret — skipping SonarCloud scan."
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          fetch-depth: 0
      # Coverage must be generated IN this job: coverage.xml is gitignored,
      # so the scanner would otherwise see 0% on every PR (new_coverage
      # gate can never pass). Mirrors codecov.yml so Sonar gets real numbers.
      - uses: actions/setup-python@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend tests with coverage (for Sonar)
        if: steps.gate.outputs.skip != 'true'
        working-directory: backend
        run: |
          pip install -r requirements.txt pytest-cov
          python -m pytest tests/test_fixes.py tests/test_cast_remux.py -q --cov=app --cov-report=xml:coverage.xml
        env:
          JWT_SECRET: ci-dummy-secret
          DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
      - uses: SonarSource/sonarqube-scan-action@v8
        if: steps.gate.outputs.skip != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
