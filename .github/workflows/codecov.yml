name: Codecov

# Free coverage for public repos: posts coverage bars + diff-coverage
# on every PR. Tokenless via OIDC (no secret needed).
on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  backend-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies + pytest-cov
        run: pip install -r requirements.txt pytest-cov pytest-asyncio

      - name: Run tests with coverage
        run: python -m pytest tests/test_fixes.py tests/test_cast_remux.py -q --cov=app --cov-report=xml:coverage.xml
        continue-on-error: true
        env:
          JWT_SECRET: ci-dummy-secret
          DATABASE_URL: sqlite+aiosqlite:///./ci_test.db

      - name: Upload to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
          use_oidc: true

  frontend-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          use_oidc: true
