name: Codecov

# Free coverage for public repos: posts coverage bars + diff-coverage
# on every PR. Tokenless via OIDC (no secret needed).
# Frontend has no test runner yet, so only backend uploads for now —
# wire frontend/coverage/lcov.info here when vitest lands.
on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  backend-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies + pytest-cov
        run: pip install -r requirements.txt pytest-cov

      - name: Run tests with coverage
        run: python -m pytest tests/test_fixes.py tests/test_cast_remux.py -q --cov=app --cov-report=xml:coverage.xml
        continue-on-error: true
        env:
          JWT_SECRET: ci-dummy-secret
          DATABASE_URL: sqlite+aiosqlite:///./ci_test.db

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
          use_oidc: true
