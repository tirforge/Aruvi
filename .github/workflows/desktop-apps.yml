name: Desktop Apps

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Web app URL to wrap"
        required: false
        default: "http://localhost:7680"
      version:
        description: "Release tag"
        required: false
        default: "desktop-v1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  platform: linux }
          - { os: windows-latest, platform: windows }
    steps:
      - name: Checkout pake toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tw93/pake

      - name: Checkout Aruvi (icon source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: aruvi

      - name: Setup environment (node + rust + system deps)
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Install mold linker (faster Linux rust builds)
        if: matrix.platform == 'linux'
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1

      - name: Build pake CLI
        run: pnpm run cli:build

      - name: Build Linux packages (.deb + .AppImage)
        if: matrix.platform == 'linux'
        timeout-minutes: 30
        shell: bash
        env:
          # via env (not ${{ }} interpolation) so a malicious url can't inject shell
          URL: ${{ inputs.url }}
        run: |
          set -e
          ICON="$GITHUB_WORKSPACE/aruvi/frontend/public/icon-desktop.png"
          node dist/cli.js "$URL" --name Aruvi --icon "$ICON" \
            --width 1280 --height 800 --targets deb,appimage
          # CLI copies artifacts to project root with lowercased names
          mkdir -p output/linux
          find . -maxdepth 1 \( -iname "*.deb" -o -iname "*.AppImage" \) \
            ! -path "./output/*" -exec mv {} output/linux/ \;
          ls -la output/linux

      - name: Build Windows packages (.msi installer + portable .exe)
        if: matrix.platform == 'windows'
        timeout-minutes: 45
        shell: pwsh
        env:
          # via env (not ${{ }} interpolation) so a malicious url can't inject script
          URL: ${{ inputs.url }}
        run: |
          $icon = "$env:GITHUB_WORKSPACE\aruvi\frontend\public\icon-desktop.ico"
          $args = $env:URL, "--name", "Aruvi", "--icon", $icon,
                  "--width", "1280", "--height", "800", "--targets", "x64"
          node dist/cli.js $args
          New-Item -Path "output\windows" -ItemType Directory -Force | Out-Null
          # pake-cli always bundles MSI via WiX and copies it to project root
          $msi = Get-ChildItem -Path "." -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) {
            $msi = Get-ChildItem -Path "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi" -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($msi) { Move-Item $msi.FullName "output\windows\" } else { Write-Error "No .msi produced"; exit 1 }
          # Portable single-binary exe straight from the rust build dir
          $rel = "src-tauri\target\x86_64-pc-windows-msvc\release"
          $raw = Get-ChildItem -Path $rel -Filter "*aruvi*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($raw) { Copy-Item $raw.FullName "output\windows\Aruvi-portable.exe" }
          Get-ChildItem -Path $rel -Filter "WebView2Loader.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName "output\windows\" }
          Get-ChildItem "output\windows"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aruvi-${{ matrix.platform }}
          path: output/**

  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.version }}
          name: Aruvi Desktop ${{ inputs.version }}
          files: dist/**
          generate_release_notes: true
