name: Dependency Review

# Free native scanner: blocks PRs that introduce packages with
# HIGH/CRITICAL known vulnerabilities. Zero secrets needed.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
