name: Dependency Review

# Free native scanner: blocks PRs that introduce packages with
# HIGH/CRITICAL known vulnerabilities. Zero secrets needed.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0 (main bumped 4->5 mid-rebase)
        with:
          fail-on-severity: high
