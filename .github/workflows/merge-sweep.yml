name: merge-sweep

# Autonomous bot-PR sweeper. On schedule (every 6h) or manual trigger, the
# sweeper agent merges green bot PRs (dependabot version bumps, opencode
# fix PRs) and reports the rest. Human PRs are never touched. It can never
# bypass branch protection (no --admin, ever).
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

# One sweep at a time: a slow xhigh run can overlap the next 6h tick and
# two sweeps merging PRs concurrently is asking for trouble. Queue behind.
concurrency:
  group: merge-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@9b4ec5714d481559990db0a816d5dec19541a814 # v2.0.26
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
          variant: xhigh
          agent: sweeper
          use_github_token: true # skip App-token exchange (its backend 502s); GITHUB_TOKEN works - merger/review/fullscan all use it
          prompt: |
            Sweep all open bot pull requests per .opencode/agents/sweeper.md:
            merge the green ones, digest the rest. Human PRs untouched.
