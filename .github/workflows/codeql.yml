name: CodeQL

on:
  push:
  pull_request:
  schedule:
    # Weekly Monday 6am UTC scan for new CVEs in existing code
    - cron: "0 6 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, java-kotlin]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Set up JDK 17 (java-kotlin only)
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK (java-kotlin only)
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v4
      - name: Build for CodeQL extraction (java-kotlin only)
        if: matrix.language == 'java-kotlin'
        # --rerun-tasks: Gradle build cache would serve compile tasks from cache, leaving CodeQL's tracer with nothing to observe ("no source code seen during build").
        run: ./gradlew :app:assembleMobileDebug :app:assembleTvDebug --no-daemon --rerun-tasks
        working-directory: android

      - uses: github/codeql-action/analyze@v4
