name: merge-agent

# On-demand merge/close agent. Trigger: Actions tab -> merge-agent ->
# Run workflow -> enter PR number + action. The merger agent verifies
# green checks then merges (regular merge) or closes with a reason.
# It can never bypass branch protection (no --admin, ever).
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to merge or close"
        required: true
      action:
        description: "merge or close"
        type: choice
        default: merge
        options: [merge, close]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@545f51d26cc39a907d2867492d498d9607ea5fa4 # v1.18.32
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
          ACTION: ${{ inputs.action }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
          variant: xhigh
          agent: merger
          use_github_token: true
          prompt: |
            Merge (or close) PR ${{ inputs.pr }} with action '${{ inputs.action }}'
            following .opencode/agents/merger.md policy exactly.
