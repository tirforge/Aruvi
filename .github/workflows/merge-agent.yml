name: merge-agent

# On-demand merge/close agent. Trigger: Actions tab -> merge-agent ->
# Run workflow -> enter PR number + action. The merger agent verifies
# green checks then merges (regular merge) or closes with a reason.
# It can never bypass branch protection (no --admin, ever).
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to merge or close"
        required: true
      action:
        description: "merge or close"
        type: choice
        default: merge
        options: [merge, close]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

# Serialize per PR (two runs merging the same PR race); re-triggering
# replaces the older run. Different PRs can still merge in parallel.
concurrency:
  group: merge-agent-pr-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve model (fallback chain)
        id: model
        env:
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || '' }}
          OPENCODE_MODEL_CHAIN: ${{ vars.OPENCODE_MODEL_CHAIN || 'opencode/deepseek-v4.1-flash-free opencode/glm-5.3-flash-free opencode/minimax-m3.1-flash-free opencode/big-pickle' }}
          OPENCODE_VARIANT_CHAIN: ${{ vars.OPENCODE_VARIANT_CHAIN || '' }}
        run: bash .github/scripts/resolve-model.sh >> "$GITHUB_OUTPUT"

      - uses: anomalyco/opencode/github@9b4ec5714d481559990db0a816d5dec19541a814 # v2.0.26
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
          ACTION: ${{ inputs.action }}
        with:
          model: ${{ steps.model.outputs.model }}
          variant: ${{ steps.model.outputs.variant }}
          agent: merger
          use_github_token: true
          prompt: |
            Merge (or close) PR ${{ inputs.pr }} with action '${{ inputs.action }}'
            following .opencode/agents/merger.md policy exactly.
