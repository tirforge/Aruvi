# SonarCloud project binding. If sonarcloud.io gives you a different
# project key during import, update the key below to match.
sonar.organization=tirforge
sonar.projectKey=tirforge_Aruvi
sonar.projectName=Aruvi
sonar.sources=backend/app,frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/assets/**,**/*.test.*,**/tests/**
sonar.python.version=3.11
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml
