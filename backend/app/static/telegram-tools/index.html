<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Telegram Tools — Session String Generator, Converter &amp; Analyzer
    </title>
    <meta
      name="description"
      content="Generate, convert, analyze and inspect Telegram MTProto session strings for gotg, GramJS, Kurigram, mtcute and Telethon — all client-side, zero backend."
    />
    <meta name="theme-color" content="#020617" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta property="og:title" content="Telegram Tools" />
    <meta
      property="og:description"
      content="Generate, convert, analyze and inspect Telegram MTProto session strings — all in your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/telegram-tools/assets/index-DOpHwBVE.js"></script>
    <link rel="stylesheet" crossorigin href="/telegram-tools/assets/index-r9GeLwhz.css">
  </head>
  <body>
    <div id="app"></div>
  

<script>
(function(){
  if (window.__aruviEnvTile) return; window.__aruviEnvTile = true;

  const CSS = `
  #aetu-card{max-width:960px;margin:26px auto 60px;background:#12121a;border:1px solid rgba(255,255,255,.08);
    border-radius:16px;padding:24px;color:#E6E8EB;font-family:Inter,system-ui,sans-serif}
  #aetu-card h2{font-size:1.1rem;margin:0 0 4px;background:linear-gradient(135deg,#6366f1,#ec4899);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;display:inline-block}
  .aetu-sub{color:#9CA3AF;font-size:.76rem;margin:0 0 16px}
  .aetu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
  .aetu-box{background:#0d0d15;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:16px}
  .aetu-box h3{margin:0 0 10px;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:#8b8fa3}
  .aetu-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}
  .aetu-row label.t{display:flex;align-items:center;gap:8px;font-size:.82rem;color:#c7cbd3;cursor:pointer}
  .aetu-row input[type=checkbox]{accent-color:#a855f7;width:16px;height:16px;cursor:pointer}
  .aetu-row input[type=text],.aetu-row input[type=number]{width:190px;background:#0a0a0f;border:1px solid rgba(255,255,255,.09);
    border-radius:7px;padding:7px 10px;color:#E6E8EB;font-size:.75rem;outline:none;font-family:'JetBrains Mono',monospace}
  .aetu-row input:focus{border-color:#6366f1}
  #aetu-sess{width:100%;min-height:64px;background:#0a0a0f;border:1px solid rgba(255,255,255,.09);border-radius:8px;
    padding:10px;color:#E6E8EB;font-size:.72rem;font-family:'JetBrains Mono',monospace;outline:none;resize:vertical;
    box-sizing:border-box;margin-top:4px}
  #aetu-sess:focus{border-color:#6366f1}
  #aetu-sess.captured{border-color:#34d399}
  textarea#aetu-out{width:100%;box-sizing:border-box;min-height:200px;background:#050507;border:1px dashed rgba(255,255,255,.16);
    border-radius:10px;padding:12px;color:#34d399;font-size:.72rem;font-family:'JetBrains Mono',monospace;
    white-space:pre;margin-top:16px;outline:none}
  .aetu-actions{display:flex;gap:10px;margin-top:12px}
  .aetu-btn{flex:1;padding:12px;border:none;border-radius:9px;font-weight:600;font-size:.88rem;cursor:pointer}
  .aetu-gen{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff}
  .aetu-copy{background:#1d1d29;color:#E6E8EB;border:1px solid rgba(255,255,255,.1)}
  .aetu-hint{font-size:.68rem;color:#6B7280;margin-top:6px}`;

  const HTML = `
  <div id="aetu-card">
    <h2>Aruvi .env Builder</h2>
    <p class="aetu-sub">Your generated session string is grabbed automatically — toggle what you need and copy.</p>

    <div class="aetu-box" style="margin-bottom:18px">
      <h3>Session</h3>
      <textarea id="aetu-sess" placeholder="Pyrogram string — auto-grabbed after login (or paste here)"></textarea>
      <p class="aetu-hint">Watch for the green border — it means your string was auto-captured ✓</p>
    </div>

    <div class="aetu-grid">
      <div class="aetu-box">
        <h3>Credentials</h3>
        <div class="aetu-row"><label class="t"><input type="checkbox" id="aetu-core" checked> Include API credentials</label></div>
        <div class="aetu-row"><input type="text" id="aetur-apiid"   placeholder="TELEGRAM_API_ID"></div>
        <div class="aetu-row"><input type="text" id="aetur-apihash" placeholder="TELEGRAM_API_HASH"></div>
      </div>

      <div class="aetu-box">
        <h3>Group / Channel</h3>
        <div class="aetu-row"><label class="t"><input type="checkbox" id="aetu-group"> Storage channel</label></div>
        <div class="aetu-row"><input type="text" id="aetur-channel" placeholder="-1001234567890"></div>
        <div class="aetu-row"><label class="t"><input type="checkbox" id="aetu-auth" checked> Auth &amp; admin IDs</label></div>
        <div class="aetu-row"><input type="text" id="aetur-authusers" placeholder="AUTH_USERS=your_telegram_id"></div>
      </div>

      <div class="aetu-box">
        <h3>Grabber · Movies</h3>
        <div class="aetu-row"><label class="t"><input type="checkbox" id="aetu-grab"> Enable grabber</label></div>
        <div class="aetu-row"><input type="text" id="aetur-groups" placeholder="GRAB_GROUP_USERNAMES=a,b"></div>
        <div class="aetu-row"><label class="t"><input type="checkbox" id="aetu-keep"> Keep search messages</label></div>
      </div>

      <div class="aetu-box">
        <h3>Cache</h3>
        <div class="aetu-row"><label class="t"><input type="checkbox" id="aetu-cache" checked> Disk cache</label></div>
        <div class="aetu-row"><span style="font-size:.72rem;color:#8b8fa3">TTL (s)</span>
          <input type="number" id="aetur-ttl" value="1800"></div>
        <div class="aetu-row"><span style="font-size:.72rem;color:#8b8fa3">Max total</span>
          <input type="text" id="aetur-maxb" value="8589934592"></div>
        <div class="aetu-row"><span style="font-size:.72rem;color:#8b8fa3">Per video</span>
          <input type="text" id="aetur-perv" value="2147483648"></div>
        <div class="aetu-row"><span style="font-size:.72rem;color:#8b8fa3">RAM/video MB</span>
          <input type="number" id="aetur-ram" value="300"></div>
      </div>
    </div>

    <textarea id="aetu-out" readonly></textarea>
    <div class="aetu-actions">
      <button class="aetu-btn aetu-gen"  id="aetu-go">Generate .env</button>
      <button class="aetu-btn aetu-copy" id="aetu-cp">Copy .env</button>
    </div>
  </div>`;

  // inject the card right after the Svelte mount point
  const appEl=document.getElementById('app');
  const cardHost=document.createElement('div');
  cardHost.innerHTML=HTML;
  (appEl&&appEl.parentNode?appEl.parentNode:document.body).insertBefore(cardHost, appEl&&appEl.nextSibling);

  const $=id=>document.getElementById(id);
  const toast=document.createElement('div');
  toast.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:30px;z-index:100001;background:#10b981;color:#04281c;padding:9px 18px;border-radius:99px;font-weight:600;font-size:.8rem;opacity:0;transition:opacity .25s;pointer-events:none';
  document.body.appendChild(toast);
  const showToast=m=>{toast.textContent=m;toast.style.opacity=1;setTimeout(()=>toast.style.opacity=0,2200)};

  function setSession(v){
    if(!v) return;
    $('aetu-sess').value=v;
    $('aetu-sess').classList.add('captured');
    showToast('Session string captured ✓');
    setTimeout(()=>$('aetu-sess').classList.remove('captured'),1600);
    build();
  }

  const RE=/\b2[A-Za-z0-9_-]{280,}\b/;
  let lastGrab='';
  new MutationObserver(()=>{
    const txt=document.body.innerText||'';
    const m=txt.match(RE);
    if(m && m[0]!==lastGrab){ lastGrab=m[0]; setSession(m[0]); }
  }).observe(document.body,{childList:true,subtree:true,characterData:true});

  // grabber ON → group defaults ON ("movies=1 ⇒ group included")
  $('aetu-grab').addEventListener('change',()=>{
    if($('aetu-grab').checked && !$('aetu-group').checked){
      $('aetu-group').checked=true;
      showToast('Storage group added (required by grabber)');
    }
    build();
  });

  function build(){
    const L=[];
    L.push('# ── Required: Telegram ──');
    if($('aetu-core').checked){
      if($('aetur-apiid').value)   L.push('TELEGRAM_API_ID='+$('aetur-apiid').value);
      if($('aetur-apihash').value) L.push('TELEGRAM_API_HASH='+$('aetur-apihash').value);
    }
    const sess=$('aetu-sess').value.trim(), grab=$('aetu-grab').checked;
    if(sess){ L.push('','# User session'); L.push('GRAB_SESSION_STRINGS='+sess); }
    if($('aetu-group').checked){
      L.push('','# Storage / streaming channel');
      if($('aetur-channel').value) L.push('TELEGRAM_STORAGE_CHANNEL_ID='+$('aetur-channel').value);
    }
    if(grab){
      L.push('','# Grabber (movies)');
      if($('aetur-groups').value) L.push('GRAB_GROUP_USERNAMES='+$('aetur-groups').value);
      L.push('GRAB_KEEP_MESSAGES='+($('aetu-keep').checked?'1':'0'));
    }
    if($('aetu-cache').checked){
      L.push('','# Cache');
      L.push('DISK_CACHE_ENABLED=1',
             'DISK_CACHE_TTL='+($('aetur-ttl').value||'1800'),
             'DISK_CACHE_MAX_BYTES='+($('aetur-maxb').value||'8589934592'),
             'DISK_CACHE_PER_VIDEO_BYTES='+($('aetur-perv').value||'2147483648'),
             'STREAM_RAM_PER_VIDEO_MB='+($('aetur-ram').value||'300'));
    }
    if($('aetu-auth').checked && $('aetur-authusers').value){
      L.push('','# Access',$('aetur-authusers').value);
    }
    $('aetu-out').value=L.join('\n')+'\n';
  }

  ['aetu-core','aetu-group','aetu-grab','aetu-cache','aetu-auth','aetu-keep'].forEach(id=>$(id).addEventListener('change',build));
  ['aetu-sess','aetur-apiid','aetur-apihash','aetur-channel','aetur-authusers','aetur-groups',
   'aetur-ttl','aetur-maxb','aetur-perv','aetur-ram'].forEach(id=>$(id).addEventListener('input',build));
  $('aetu-go').onclick=build;
  $('aetu-cp').onclick=()=>{ build();
    navigator.clipboard.writeText($('aetu-out').value)
      .then(()=>showToast('.env copied ✓'))
      .catch(()=>showToast('Copy failed — select manually')); };
  build();
})();

</script>
</body>
</html>
