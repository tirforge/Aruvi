<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Telegram Tools — Session String Generator, Converter &amp; Analyzer
    </title>
    <meta
      name="description"
      content="Generate, convert, analyze and inspect Telegram MTProto session strings for gotg, GramJS, Kurigram, mtcute and Telethon — all client-side, zero backend."
    />
    <meta name="theme-color" content="#020617" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta property="og:title" content="Telegram Tools" />
    <meta
      property="og:description"
      content="Generate, convert, analyze and inspect Telegram MTProto session strings — all in your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/telegram-tools/assets/index-DOpHwBVE.js"></script>
    <link rel="stylesheet" crossorigin href="/telegram-tools/assets/index-r9GeLwhz.css">
  </head>
  <body>
    <div id="app"></div>
  







<script>
(function(){
  if (window.__aruviEnvTileV4) return; window.__aruviEnvTileV4 = true;
  const V=n=>`var(${n})`;
  const P=V('--color-primary-500'),P6=V('--color-primary-600'),
        S9=V('--color-surface-900'),S7=V('--color-surface-700'),
        S4=V('--color-surface-400'),SL=V('--color-slate-950,#020617'),
        OK=V('--color-success-500'),MONO=V('--font-mono');
  try{
  const CSS=`
  #aruviEnv{max-width:1100px;margin:28px auto 70px;background:${S9}cc;border:1px solid ${S7};
    border-radius:.75rem;padding:1.5rem;color:#E2E8F0;font-family:var(--font-sans)}
  #aruviEnv h2{font-size:1.25rem;font-weight:700;margin:0 0 2px;background:linear-gradient(90deg,${P},#ec4899);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;display:inline-block}
  .ae-sub{color:${S4};font-size:.85rem;margin:0 0 16px}
  .ae-top{background:${SL};border:1px solid ${S7};border-radius:.6rem;padding:1rem;margin-bottom:16px}
  #ae-sess{width:100%;box-sizing:border-box;min-height:64px;background:transparent;border:none;color:#E2E8F0;
    font-size:.78rem;font-family:${MONO};outline:none;resize:vertical}
  #ae-sess.captured{color:${OK}}
  .ae-hint{font-size:.68rem;color:${S4};margin:6px 0 0}
  .ae-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
  details.ae-box{background:${SL};border:1px solid ${S7};border-radius:.6rem;overflow:hidden}
  details.ae-box[open]{border-color:${P6}}
  details.ae-box summary{list-style:none;cursor:pointer;padding:.8rem 1rem;display:flex;align-items:center;gap:10px;
    font-size:.82rem;font-weight:600;user-select:none}
  details.ae-box summary::-webkit-details-marker{display:none}
  .ae-chev{margin-left:auto;transition:transform .2s;color:${S4}}
  details[open].ae-box .ae-chev{transform:rotate(90deg)}
  .ae-dot{width:8px;height:8px;border-radius:99px;background:${S7};flex-shrink:0}
  details[open].ae-box .ae-dot{background:${OK};box-shadow:0 0 8px ${OK}}
  .ae-body{padding:0 1rem 1rem}
  .ae-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0}
  .ae-k{font-size:.75rem;color:${S4};min-width:150px}
  .ae-row input[type=text],.ae-row input[type=number],.ae-row input[type=password]{flex:1;width:190px;background:#000;
    border:1px solid ${S7};border-radius:.45rem;padding:7px 10px;color:#E2E8F0;font-size:.74rem;outline:none;
    font-family:${MONO};transition:border-color .15s}
  .ae-row input:focus{border-color:${P}}
  .ae-row input[type=checkbox]{accent-color:${P};width:16px;height:16px;cursor:pointer}
  .ae-t{display:flex;align-items:center;gap:8px;font-size:.82rem;color:#c7cbd3;cursor:pointer;min-width:auto}
  #ae-out{width:100%;box-sizing:border-box;min-height:230px;background:#000;border:1px dashed ${S7};
    border-radius:.6rem;padding:12px;color:${OK};font-size:.72rem;font-family:${MONO};white-space:pre;margin-top:16px;outline:none}
  .ae-actions{display:flex;gap:10px;margin-top:12px}
  .ae-btn{flex:1;padding:11px;border:none;border-radius:.55rem;font-weight:600;font-size:.88rem;cursor:pointer}
  .ae-gen{background:${P};color:#fff}.ae-gen:hover{background:${P6}}
  .ae-copy{background:#1e293b;color:#E2E8F0;border:1px solid ${S7}}`;

  const SEC=(id,title,on,body)=>`
   <details class="ae-box" id="sec-${id}" ${on?'open':''}><summary><span class="ae-dot"></span>${title}<span class="ae-chev">›</span></summary>
   <div class="ae-body">${body}</div></details>`;
  const R=(k,id,ph,type,val)=>`<div class="ae-row"><span class="ae-k">${k}</span>
   <input type="${type||'text'}" id="${id}" placeholder="${ph||''}" value="${val||''}" spellcheck="false" autocomplete="off"></div>`;
  const CK=(id,label,on)=>`<div class="ae-row"><label class="ae-t"><input type="checkbox" id="${id}" ${on?'checked':''}> ${label}</label></div>`;

  const host=document.createElement('div'); host.id='aruviEnvHost';
  host.innerHTML=`
  <div id="aruviEnv">
    <h2>Aruvi .env Builder</h2>
    <p class="ae-sub">Every section maps 1-to-1 to Aruvi's <span style="font-family:${MONO}">.env.example</span>. Your generated string is captured automatically.</p>
    <div class="ae-top">
      <div class="ae-row"><span class="ae-k">Session (auto-grabbed)</span></div>
      <textarea id="ae-sess" placeholder="Pyrogram session string appears here after login…"></textarea>
      <p class="ae-hint">Green = captured ✓ · you may also paste manually</p>
    </div>
    <div class="ae-grid">
      ${SEC('tg','Telegram',true,
        R('API ID','ae-api-id','','text','35927937')+
        R('API HASH','ae-api-hash','','password','c77b345b46f1a9b1811a1998cd9e1d24')+
        R('BOT TOKEN','ae-bot-token','123456:ABC…')+
        CK('ae-use-channel','Include storage channel',true)+
        R('STORAGE CHANNEL ID','ae-channel','-1001234567890'))}
      ${SEC('helper','Helper Bots',false,
        R('HELPER BOT TOKENS','ae-helper-tokens','token1,token2,token3')+
        R('BOT SESSION STRINGS','ae-bot-strings','session1,session2'))}
      ${SEC('auth','Auth & Access',true,
        R('AUTH_USERS','ae-auth-users','your_telegram_id')+
        R('ADMIN_IDS','ae-admin-ids','your_telegram_id')+
        R('JWT_SECRET','ae-jwt','openssl rand -hex 32'))}
      ${SEC('db','Database',false,
        R('DATABASE_URL','ae-db','postgresql+asyncpg://user:pass@host/db'))}
      ${SEC('server','Server',true,
        R('SERVER_PORT','ae-port','','number','7680')+
        R('WEB_BASE_URL','ae-webbase','https://movie.example.com'))}
      ${SEC('stream','Streaming Engine',true,
        R('STREAM_BATCH_SIZE','ae-bs','','number','10')+
        R('STREAM_MAX_CONCURRENT','ae-mc','','number','4')+
        R('STREAM_RAM_PER_VIDEO_MB','ae-ram','','number','300')+
        R('STREAM_INFLIGHT_MB','ae-inf','','number','200')+
        R('STREAM_PREFETCH_AHEAD_MB','ae-pfa','','number','192')+
        R('STREAM_PREFETCH_CONCURRENCY','ae-pfc','','number','3')+
        R('STREAM_PREFETCH_MAX_STREAMS','ae-pms','','number','6')+
        R('STREAM_BATCH_TIMEOUT_S','ae-bt','','number','30')+
        R('STREAM_BATCH_STALL_S','ae-stall','','number','15')+
        R('STREAM_CHUNK_TIMEOUT_S','ae-ct','','number','15')+
        R('STREAM_SEM_WAIT_TIMEOUT_S','ae-sw','','number','10')+
        R('TELEGRAM_CLIENT_CONCURRENCY','ae-tcc','','number','8'))}
      ${SEC('cache','Disk Cache',true,
        CK('ae-cache-on','Enable disk cache',true)+
        R('DISK_CACHE_DIR','ae-cdir','./data/vcache','text','./data/vcache')+
        R('DISK_CACHE_TTL','ae-ttl','','number','1800')+
        R('DISK_CACHE_MAX_BYTES','ae-maxb','','text','8589934592')+
        R('DISK_CACHE_PER_VIDEO_BYTES','ae-perv','','text','2147483648'))}
      ${SEC('opt','Optimized',false,
        R('STREAM_MEM_PRESSURE_RATIO','ae-mpr','','text','0.6'))}
      ${SEC('subs','Subtitles',false,
        R('SUBTITLE_LANGUAGES','ae-slang','','text','en')+
        R('SUBTITLE_PROVIDERS','ae-sprov','','text','podnapisi,tvsubtitles,addic7ed')+
        R('OPENSUBTITLES_API_KEY','ae-oskey','','password')+
        R('OPENSUBTITLES_USERNAME','ae-osuser','')+
        R('OPENSUBTITLES_PASSWORD','ae-ospass','','password'))}
      ${SEC('grab','Grabber · Movies',false,
        CK('ae-grab','Enable grabber (auto-adds storage channel)')+
        R('GRAB_GROUP_USERNAMES','ae-groups','my_movies,my_series')+
        R('GRAB_BOT_USERNAMES','ae-gbots','','text','AutoFilterBot')+
        CK('ae-keep','Keep search messages'))}
      ${SEC('gdrive','Google Drive',false,
        R('GDRIVE_CLIENT_ID','ae-gcid','','password')+
        R('GDRIVE_CLIENT_SECRET','ae-gcs','','password'))}
    </div>
    <textarea id="ae-out" readonly spellcheck="false"></textarea>
    <div class="ae-actions">
      <button class="ae-btn ae-gen"  id="ae-go">Generate .env</button>
      <button class="ae-btn ae-copy" id="ae-copy">Copy .env</button>
    </div>
  </div>`;

  const style=document.createElement('style'); style.textContent=CSS;
  const mountAt=document.getElementById('app');
  const styleElOk=document.head.appendChild(style);
  if(mountAt&&mountAt.parentNode){mountAt.parentNode.insertBefore(host,mountAt.nextSibling);}
  else{document.body.appendChild(host);}
  }catch(e){ console.error('[ENV-TILE] init failed',(e&&e.stack)||e); return; }

  // ---- logic phase (fully guarded) ----
  try{
  const q=id=>document.getElementById(id);
  const val=id=>{const e=q(id);return e?String(e.value).trim():''};
  const on =id=>{const e=q(id);return e?!!e.checked:false};

  const toastEl=document.createElement('div');
  toastEl.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:30px;z-index:100001;background:'+getComputedStyle(document.documentElement).getPropertyValue('--color-success-500')+';color:#052e16;padding:9px 18px;border-radius:99px;font-weight:600;font-size:.8rem;opacity:0;transition:opacity .25s;pointer-events:none';
  document.body.appendChild(toastEl);
  let toastT; const toast=m=>{toastEl.textContent=m;toastEl.style.opacity=1;
    clearTimeout(toastT);toastT=setTimeout(()=>toastEl.style.opacity=0,2200)};

  function setSession(v){
    if(!v)return; const e=q('ae-sess'); if(!e)return;
    e.value=v; e.classList.add('captured');
    toast('Session string captured ✓');
    setTimeout(()=>{const x=q('ae-sess');if(x)x.classList.remove('captured')},1600);
    build();
  }
  window.__aruviSetSession=setSession; // manual hook if needed

  const RE=/\b2[A-Za-z0-9_-]{280,}\b/; let lastGrab='';
  setInterval(()=>{                                   // polling: immune to observer quirks
    try{
      const txt=document.body?document.body.innerText:'';
      const m=txt.match(RE);
      if(m&&m[0]!==lastGrab){lastGrab=m[0];setSession(m[0]);}
    }catch(e){/* never break the page */}
  },700);

  function esc(s){return String(s==null?'':s);}
  function put(L,k,id,ph){const v=val(id);
    if(v)L.push(k+'='+v); else L.push('# '+k+'='+(ph!=null?ph:(q(id)&&q(id).placeholder)||''));}

  function build(){
    try{
      const L=[];
      L.push('# ── Required: Telegram ──');
      put(L,'TELEGRAM_API_ID','ae-api-id');
      put(L,'TELEGRAM_API_HASH','ae-api-hash');
      put(L,'TELEGRAM_BOT_TOKEN','ae-bot-token');
      if(on('ae-use-channel'))put(L,'TELEGRAM_STORAGE_CHANNEL_ID','ae-channel','-1001234567890');

      L.push('','# ── Helper bots (optional) ──');
      put(L,'TELEGRAM_HELPER_BOT_TOKENS','ae-helper-tokens','token1,token2');
      put(L,'TELEGRAM_BOT_SESSION_STRINGS','ae-bot-strings','');

      L.push('','# ── User session (grabber) ──');
      put(L,'GRAB_SESSION_STRINGS','ae-sess');

      L.push('','# ── Auth ──');
      put(L,'AUTH_USERS','ae-auth-users','your_telegram_id');
      put(L,'ADMIN_IDS','ae-admin-ids','your_telegram_id');
      put(L,'# JWT_SECRET','ae-jwt','openssl rand -hex 32');

      L.push('','# ── Database ──');
      put(L,'# DATABASE_URL','ae-db','postgresql+asyncpg://user:pass@host/db');

      L.push('','# ── Server ──');
      put(L,'SERVER_PORT','ae-port','7680');
      put(L,'WEB_BASE_URL','ae-webbase','https://movie.example.com');

      L.push('','# ── Streaming engine ──');
      [['STREAM_BATCH_SIZE','ae-bs'],['STREAM_MAX_CONCURRENT','ae-mc'],
       ['STREAM_RAM_PER_VIDEO_MB','ae-ram'],['STREAM_INFLIGHT_MB','ae-inf'],
       ['STREAM_PREFETCH_AHEAD_MB','ae-pfa'],['STREAM_PREFETCH_CONCURRENCY','ae-pfc'],
       ['STREAM_PREFETCH_MAX_STREAMS','ae-pms'],['STREAM_BATCH_TIMEOUT_S','ae-bt'],
       ['STREAM_BATCH_STALL_S','ae-stall'],['STREAM_CHUNK_TIMEOUT_S','ae-ct'],
       ['STREAM_SEM_WAIT_TIMEOUT_S','ae-sw'],['TELEGRAM_CLIENT_CONCURRENCY','ae-tcc']]
       .forEach(([k,id])=>put(L,k,id));

      L.push('','# ── Disk cache ──');
      L.push('DISK_CACHE_ENABLED='+(on('ae-cache-on')?'1':'0'));
      put(L,'DISK_CACHE_DIR','ae-cdir','./data/vcache');
      put(L,'DISK_CACHE_TTL','ae-ttl','1800');
      put(L,'DISK_CACHE_MAX_BYTES','ae-maxb','8589934592');
      put(L,'DISK_CACHE_PER_VIDEO_BYTES','ae-perv','2147483648');

      L.push('','# ── Optimized ──');
      put(L,'# STREAM_MEM_PRESSURE_RATIO','ae-mpr','0.6');

      L.push('','# ── Subtitles (optional) ──');
      put(L,'SUBTITLE_LANGUAGES','ae-slang','en');
      put(L,'SUBTITLE_PROVIDERS','ae-sprov','podnapisi,tvsubtitles,addic7ed');
      put(L,'# OPENSUBTITLES_API_KEY','ae-oskey','');
      put(L,'# OPENSUBTITLES_USERNAME','ae-osuser','');
      put(L,'# OPENSUBTITLES_PASSWORD','ae-ospass','');

      L.push('','# ── Grab / movie search ──');
      put(L,'GRAB_GROUP_USERNAMES','ae-groups','my_movies');
      put(L,'GRAB_BOT_USERNAMES','ae-gbots','AutoFilterBot');
      L.push('GRAB_KEEP_MESSAGES='+(on('ae-keep')?'1':'0'));

      L.push('','# ── Google Drive (optional) ──');
      put(L,'# GDRIVE_CLIENT_ID','ae-gcid','');
      put(L,'# GDRIVE_CLIENT_SECRET','ae-gcs','');

      const out=q('ae-out'); if(out)out.value=L.join('\n')+'\n';
    }catch(e){console.error('[ENV-TILE] build failed',(e&&e.stack)||e);}
  }

  ['ae-use-channel','ae-grab','ae-cache-on','ae-keep'].forEach(id=>{
    const e=q(id); if(e)e.addEventListener('change',()=>{
      if(id==='ae-grab'&&on('ae-grab')&&!on('ae-use-channel')){
        const g=q('ae-use-channel'); if(g)g.checked=true;
        toast('Storage channel added (required by grabber)');
      }
      build();
    });
  });
  document.querySelectorAll('#aruviEnv input,#aruviEnv textarea').forEach(e=>{
    e.addEventListener('input',build);
  });
  const go=q('ae-go'),cp=q('ae-copy'),out=q('ae-out');
  if(go)go.onclick=build;
  if(cp)cp.onclick=function(){build();
    const t=out?out.value:''; const done=()=>toast('.env copied ✓');
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>toast('Copy failed'));
    else toast('Copy failed');};
  build();
  }catch(e){console.error('[ENV-TILE] logic failed',(e&&e.stack)||e);}
})();

</script>
</body>
</html>
