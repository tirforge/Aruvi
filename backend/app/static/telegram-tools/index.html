    <div class="ae-grid">

  // Accept Pyrogram("2…") AND GramJS/Telethon("1…") long blobs
  // NOTE: \b fails here — base64 std uses +/ (non-word chars) which would
  // split the match. Use explicit lookarounds over the FULL b64 alphabet.
  const RE=/(?<![A-Za-z0-9+\/_=-])[12][A-Za-z0-9+\/_=-]{300,}(?![A-Za-z0-9+\/_=-])/g;
  let lastGrab='';
  function pickSession(txt){
    let best=null;
    for(const m of txt.matchAll(RE)) if(!best||m[0].length>best.length) best=m[0];
    return best;
  }

        let n; while((n=w.nextNode()))txt+=n.nodeValue+'\u0000';
      }catch(e){txt=document.body?document.body.innerText:'';}
      const m=pickSession(txt);
      if(m&&m!==lastGrab){lastGrab=m;

  // ---- format detection + GramJS/Telethon → Pyrogram conversion ----
  function b64ToBytes(s){
    s=s.replace(/-/g,'+').replace(/_/g,'/');
    while(s.length%4)s+='=';
    const bin=atob(s); const u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    return u;
  }
  function bytesToB64url(u){
    let bin=''; for(let i=0;i<u.length;i+=0x8000)
      bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
    return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function detectFormat(s){
    if(!s||s.length<50)return 'unknown';
    if(s[0]==='2')return 'pyrogram';
    try{
      const r=b64ToBytes(s.slice(1));
      if(r[0]>=1&&r[0]<=5&&r.length>=263){          // dc + addr + port + 256 key
        const al=(r[1]<<8)|r[2];
        if((al===4||al===16)&&r.length===5+al+256)return 'gramjs';
      }
      if(r.length===263||r.length===275)return 'telethon';
    }catch(e){}
    return 'unknown';
  }
  function toPyrogram(s,apiId){
    const fmt=detectFormat(s);
    if(fmt==='pyrogram'||fmt==='unknown')return {str:s,fmt};
    let raw=b64ToBytes(s.slice(1)),dc,port,ipLen,auth;
    if(fmt==='unknown'&&s[0]==='1'){
      // try both layouts, trust the one yielding a 256-byte key
      for(const L of [4,16]){
        const p=(raw[1]<<8)|raw[2];
        if(p===L&&raw.length===5+L+256){fmt='gramjs';break;}
        if(L===16&&raw.length===19+256){fmt='telethon';}
      }
      if(fmt==='unknown')return{str:s,fmt};
    }
    if(fmt==='gramjs'){
      dc=raw[0]; ipLen=(raw[1]<<8)|raw[2];
      port=(raw[3+ipLen]<<8)|raw[4+ipLen]; auth=raw.slice(5+ipLen);
    }else{ // telethon
      dc=raw[0];
      if(raw.length===263){ipLen=4;}else{ipLen=16;}
      port=(fmt==='gramjs')?(raw[3+ipLen]<<8)|raw[4+ipLen]
                            :raw[1+ipLen]|(raw[2+ipLen]<<8); // LE
      auth=raw.slice(1+ipLen+2);
    }
    // Pyrogram v2: '2' + pack('<B?i256sq?',dc,test,api_id,key,user_id,is_bot)
    const out=new Uint8Array(1+1+1+4+256+8+1);
    out[0]=0x32;                       // '2'
    out[1]=dc;                         // dc_id
    out[2]=0;                          // test_mode
    const dv=new DataView(out.buffer);
    dv.setInt32(3,Number(apiId)||0,true);
    out.set(auth,7);
    dv.setBigInt64(7+256,BigInt(0),true);   // user_id (client refreshes it)
    out[7+256+8]=0;                    // is_bot
    return {str:bytesToB64url(out),fmt};
  }

  function esc(s){return String(s==null?'':s);}

  function tryInjectNavCard(){
    if(navInjected && document.getElementById('aetu-nav-card')) return;
    const genBtn=[...document.querySelectorAll('button')].find(b=>
      b.textContent.includes('Create session strings'));
    if(!genBtn) return;
    // Host OUTSIDE the Svelte-managed grid so its reconciler can't prune us.
    let wrap=document.getElementById('aetu-nav-wrap');
    if(!wrap){
      wrap=document.createElement('div'); wrap.id='aetu-nav-wrap';
      wrap.style.cssText='display:flex;justify-content:flex-end;max-width:1100px;margin:12px auto -6px;padding:0 4px';
      const appEl=document.getElementById('app');
      if(appEl&&appEl.parentNode)appEl.parentNode.insertBefore(wrap,appEl);
      else document.body.prepend(wrap);
    }
    const card=genBtn.cloneNode(true);
    card.id='aetu-nav-card';
    card.type='button';
    // rewrite texts
    const strong=card.querySelector('strong, h3, .font-semibold, span');
    const divs=card.querySelectorAll('div:not(:has(*))');
    // simpler: rebuild text nodes
    const textEls=[...card.querySelectorAll('*')].filter(e=>e.children.length===0 && e.textContent.trim());
    // first text element = title, second = description
    if(textEls[0]) textEls[0].textContent='Aruvi .env Builder';
    if(textEls[1]) textEls[1].textContent='Build your complete .env with toggles';
    // swap icon to file-code
    const svg=card.querySelector('svg path');
    if(svg){
      svg.setAttribute('d','M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M16 13H8 M16 17H8 M10 9H8');
    }
    card.addEventListener('click',openWizard);
    wrap.appendChild(card);
    navInjected=true;
  }
  setInterval(tryInjectNavCard,500);
  setTimeout(tryInjectNavCard,100);

  ['ae-use-channel','ae-grab','ae-cache-on','ae-keep'].forEach(id=>{
    const e=q(id); if(e)e.addEventListener('change',()=>{
      if(id==='ae-grab'&&on('ae-grab')&&!on('ae-use-channel')){
        const g=q('ae-use-channel'); if(g)g.checked=true;
        toast('Storage channel added (required by grabber)');
      }
      build();
    });
  });
  document.querySelectorAll('#aruviEnv input,#aruviEnv textarea').forEach(e=>{
    e.addEventListener('input',build);
  });

  // ================= Guided Wizard =================
  const wiz=document.createElement('div');
  wiz.id='aetu-wizard';
  wiz.style.cssText='position:fixed;inset:0;z-index:100002;background:rgba(2,6,23,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:18px;font-family:var(--font-sans)';
  document.body.appendChild(wiz);

  let wizWantGrab=false;
  let captureHandler=null;   // armed while user is off completing login

  function wizClose(){wiz.style.display='none';
    if(captureHandler){window.removeEventListener('aruvi-session',captureHandler);captureHandler=null;}}
  const WBTN=(id,label,primary)=>'<button id="'+id+'" style="flex:1;padding:11px;border-radius:.55rem;font-weight:600;font-size:.88rem;cursor:pointer;border:1px solid '+S7+';'+
    (primary?'background:'+P+';color:#fff;border-color:transparent':'background:'+S800+';color:#E2E8F0')+'">'+label+'</button>';
  function wizRender(html){
    wiz.innerHTML='<div style="width:100%;max-width:520px;background:'+S9+';border:1px solid '+S7+
      ';border-radius:.9rem;padding:26px;color:#E2E8F0">'+html+'</div>';
    wiz.style.display='flex';
  }

  function applyCapture(v){
    if(wizWantGrab){const g=q('ae-grab');if(g&&!g.checked){g.checked=true;g.dispatchEvent(new Event('change'));}}
    setSession(v);
  }

  // Fires no matter where the string came from (generator above, paste box,
  // another tab of this page) — then brings the user down to the builder.
  function fireCapture(v){
    v=String(v); hidePill();
    if(captureHandler){
      const h=captureHandler; captureHandler=null;
      window.removeEventListener('aruvi-session',h);
      h({detail:v});
    }
  }
  function armCapture(){
    if(captureHandler)return;
    captureHandler=ev=>{
      const v=(ev&&ev.detail)||window.__aruviSession;
      if(!v)return;
      captureHandler=null;
      window.removeEventListener('aruvi-session',captureHandler);
      applyCapture(v);
      toast('✓ Session captured — opening .env builder');
      setTimeout(()=>{wizClose();hidePill();scrollToBuilder();},500);
    };
    window.addEventListener('aruvi-session',captureHandler);
    showPill();
  }

  function openWizard(){
    wizWantGrab=false;
    wizRender(`
      <h2 style="margin:0 0 6px;font-size:1.15rem;font-weight:700">Movie Grabber?</h2>
      <p style="color:${S4};font-size:.85rem;margin:0 0 18px">
        Do you want Aruvi to <b style="color:#E2E8F0">search & fetch movies</b> from your Telegram groups?</p>
      <div style="display:flex;gap:10px">
        ${WBTN('w-yes','Yes — enable Grabber',true)}
        ${WBTN('w-no','No')}
      </div>
      <p style="margin:14px 0 0;font-size:.72rem;color:${S4}">Changeable later in the .env builder.</p>`);
    document.getElementById('w-yes').onclick=()=>{wizWantGrab=true;wizNeedSession();};
    document.getElementById('w-no').onclick=()=>{
      wizWantGrab=false;
      wizClose();
      scrollToBuilder();
    };
  }

  function wizNeedSession(){
    if(window.__aruviSession){          // already have one — straight through
      applyCapture(window.__aruviSession);
      wizClose();scrollToBuilder();
      return;
    }
    wizRender(`
      <h2 style="margin:0 0 6px;font-size:1.15rem;font-weight:700">Grabber needs your account</h2>
      <p style="color:${S4};font-size:.85rem;margin:0 0 14px">
        We'll create a <b style="color:#E2E8F0">Telegram user session</b> with the
        <b style="color:#E2E8F0">Generator</b> right here — phone → code → done.</p>
      <ol style="color:${S4};font-size:.8rem;margin:0 0 16px;padding-left:20px">
        <li>Click “Open Generator”.</li>
        <li>User → API ID / HASH → phone → code (2FA if asked).</li>
        <li>The moment the string appears, we jump back here automatically.</li>
      </ol>
      <div style="display:flex;gap:10px">
        ${WBTN('w-open','Open Generator ↑',true)}
        ${WBTN('w-cancel','Cancel')}
      </div>
      <div id="w-status" style="margin-top:12px;font-size:.8rem;color:${OK}">Listening…</div>
      <textarea id="w-paste" placeholder="…or paste a Pyrogram string here"
        style="margin-top:10px;width:100%;box-sizing:border-box;min-height:52px;background:#000;
        border:1px solid ${S7};border-radius:.5rem;padding:8px;color:#E2E8F0;font-size:.72rem;
        font-family:${MONO};outline:none"></textarea>
      <button id="w-usepaste" class="aetu-btn aetu-copy" style="margin-top:8px;width:100%">Use pasted string</button>`);
    document.getElementById('w-open').onclick=()=>{
      wizClose();                                  // free the page first
      armCapture();                                // still listening while away
      const gen=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('Create session strings'));
      if(gen){gen.scrollIntoView({behavior:'smooth',block:'start'});
              setTimeout(()=>gen.click(),350);}
      else scrollToBuilder();
      toast('Generator opened — complete login, we take over from there');
    };
    document.getElementById('w-cancel').onclick=()=>{wizClose();hidePill();};
    document.getElementById('w-paste').addEventListener('input',e=>{
      const v=e.target.value.trim();
      if(v.length>=50){                            // pasted enough → treat as captured
        applyCapture(v); wizClose(); scrollToBuilder();
        toast('✓ Pasted session applied');
      }
    });
    document.getElementById('w-usepaste').onclick=()=>{
      const v=document.getElementById('w-paste').value.trim();
      if(v.length<50){document.getElementById('w-status').textContent='That string looks too short.';return;}
      document.getElementById('w-paste').dispatchEvent(new Event('input'));
    };
    armCapture();
  }

  const go=q('ae-go'),cp=q('ae-copy'),out=q('ae-out');
  if(go)go.onclick=build;
  if(cp)cp.onclick=function(){build();
    const t=out?out.value:''; const done=()=>toast('.env copied ✓');
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>toast('Copy failed'));
    else toast('Copy failed');};
  build();
  }catch(e){console.error('[ENV-TILE] logic failed',(e&&e.stack)||e);}
})();

</script>
