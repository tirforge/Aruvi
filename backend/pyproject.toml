[tool.ruff]
# Lint gate for the FastAPI backend (Python 3.11 per Dockerfile).
# Tight set only: pycodestyle errors + pyflakes. Deliberately NOT enabling
# style rules (BLE/B008/UP/S/I) or `ruff format` yet — 31 files predate
# formatting and 400+ style nits would drown real bugs. Widen later.
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    # Import-time side effects (e.g. ctypes libc preload in main.py) must run
    # before the imports below them — E402 flags this deliberate pattern.
    "E402",
]
